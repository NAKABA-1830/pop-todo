<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff9ed"><title>POP TODO</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#293044;background:#fff9ed}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:640px;margin:auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 25px) 18px calc(env(safe-area-inset-bottom) + 110px)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:#f47e61}.heading{display:flex;justify-content:space-between;align-items:center}.heading h1{font-size:33px;margin:5px 0 16px;letter-spacing:-.06em}.smile{font-size:30px;background:#ffdf69;border-radius:18px;padding:10px;transform:rotate(8deg)}.summary{background:#fff;border:2px solid #2c3444;border-radius:22px;padding:18px;box-shadow:5px 5px 0 #293044;margin-bottom:24px}.summarytop{display:flex;justify-content:space-between;align-items:center;font-weight:800}.summarytop strong{font-size:25px;color:#ee765a}.progress{height:12px;background:#f0eee9;border-radius:20px;overflow:hidden;margin:12px 0 5px}.bar{height:100%;background:#86d5ae;width:0%;transition:width .3s}.sub{font-size:12px;color:#81818c}.filters{display:flex;gap:8px;overflow-x:auto;padding:3px 2px 12px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:2px solid #293044;background:#fff;border-radius:100px;padding:10px 15px;font-size:13px;font-weight:800}.filter.active{background:#293044;color:#fff}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:12px 0 14px}.sectiontitle h2{font-size:19px;margin:0}.count{font-size:12px;color:#777}.tasks{display:grid;grid-template-columns:1fr;gap:13px}.task{border:2px solid #293044;border-radius:18px;padding:16px;box-shadow:4px 4px 0 #293044;position:relative}.task.life{background:#dcf6e7}.task.work{background:#e2eaff}.task.fun{background:#ffe5d7}.taskhead{display:flex;gap:12px;align-items:flex-start}.check{flex:none;border:2px solid #293044;background:#fff;width:27px;height:27px;border-radius:9px;display:grid;place-items:center;font-size:17px;font-weight:900}.task.done{opacity:.62}.task.done .taskname{text-decoration:line-through}.task.done .check{background:#293044;color:#fff}.taskcontent{flex:1;min-width:0}.taskname{font-size:16px;font-weight:850;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.pill{font-size:11px;font-weight:750;background:#ffffffa9;border-radius:100px;padding:5px 9px}.edit{border:0;background:#ffffffa0;border-radius:10px;padding:7px 10px;font-size:17px}.empty{text-align:center;padding:65px 15px;color:#7c7c85}.empty b{display:block;color:#293044;margin-bottom:8px}.add{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 23px);left:50%;transform:translateX(-50%);border:2px solid #293044;background:#ffce58;color:#293044;border-radius:100px;padding:16px 30px;font-size:16px;font-weight:900;box-shadow:4px 5px 0 #293044;white-space:nowrap;z-index:5}.overlay{position:fixed;inset:0;background:#29304488;display:none;align-items:flex-end;justify-content:center;z-index:10}.overlay.show{display:flex}.sheet{background:#fffdf7;border-radius:25px 25px 0 0;padding:23px 20px calc(env(safe-area-inset-bottom) + 26px);width:100%;max-width:640px;max-height:90dvh;overflow:auto}.sheet h2{margin:0 0 20px}.field{display:block;font-weight:800;font-size:13px;margin:15px 0 7px}.control{width:100%;border:2px solid #293044;border-radius:13px;padding:13px;background:#fff;font-size:16px;min-height:49px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:9px;margin-top:24px}.primary,.secondary,.danger{border:2px solid #293044;border-radius:13px;padding:14px;font-weight:850}.primary{background:#ffce58;flex:1}.secondary{background:#fff}.danger{background:#ffe0de;color:#b63737}.footer{text-align:center;font-size:11px;color:#999;margin-top:35px}@media(min-width:550px){.tasks{grid-template-columns:1fr 1fr}}
</style></head><body><main class="app"><div class="heading"><div><div class="eyebrow">MAKE TODAY A GOOD DAY ✦</div><h1>My To Do<span style="color:#f47e61">.</span></h1></div><div class="smile">☺</div></div><div class="summary"><div class="summarytop"><span>今日もコツコツいこう ✨</span><strong id="percent">0%</strong></div><div class="progress"><div class="bar" id="bar"></div></div><div class="sub" id="progressText">タスクを追加してみよう！</div></div><nav class="filters" id="filters"><button class="filter active" data-cat="all">✦ すべて</button><button class="filter" data-cat="life">🏠 生活</button><button class="filter" data-cat="work">💻 仕事</button><button class="filter" data-cat="fun">🎉 遊び</button></nav><div class="sectiontitle"><h2 id="sectionTitle">やることリスト</h2><span class="count" id="count"></span></div><section class="tasks" id="tasks"></section><p class="footer">データはこのブラウザ内に保存されます</p></main><button class="add" id="add">＋ タスクを追加</button><div class="overlay" id="overlay"><form class="sheet" id="form"><h2 id="modalTitle">新しいタスク ✨</h2><label class="field" for="name">やること</label><input class="control" id="name" maxlength="120" placeholder="例：週末の予定を決める" required><label class="field" for="category">ジャンル</label><select class="control" id="category"><option value="life">🏠 生活</option><option value="work">💻 仕事</option><option value="fun">🎉 遊び</option></select><div class="twocol"><div><label class="field" for="due">期限（任意）</label><input class="control" type="date" id="due"></div><div><label class="field" for="priority">優先度</label><select class="control" id="priority"><option value="normal">ふつう</option><option value="high">🔥 高い</option><option value="low">低め</option></select></div></div><div class="actions"><button type="button" class="secondary" id="cancel">戻る</button><button type="button" class="danger" id="delete" hidden>削除</button><button class="primary" type="submit">保存する ✓</button></div></form></div><script>
(()=>{'use strict';const KEY='pop-todo-v1';let tasks=[];try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))tasks=v.filter(x=>x&&typeof x.name==='string'&&['life','work','fun'].includes(x.category));}catch(e){}let filter='all',editing=null;const $=id=>document.getElementById(id),labels={life:'🏠 生活',work:'💻 仕事',fun:'🎉 遊び'};function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){alert('保存できませんでした。ブラウザの空き容量やプライベートモードを確認してください。')}}function render(){const done=tasks.filter(t=>t.done).length,p=tasks.length?Math.round(done/tasks.length*100):0;$('percent').textContent=p+'%';$('bar').style.width=p+'%';$('progressText').textContent=tasks.length?`${tasks.length}個中 ${done}個クリア！`:'タスクを追加してみよう！';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.cat===filter));$('sectionTitle').textContent=filter==='all'?'やることリスト':labels[filter]+' のタスク';const visible=tasks.filter(t=>filter==='all'||t.category===filter).sort((a,b)=>Number(a.done)-Number(b.done)||Number(b.priority==='high')-Number(a.priority==='high')||(a.due||'9999').localeCompare(b.due||'9999'));$('count').textContent=visible.length+'件';const area=$('tasks');area.replaceChildren();if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<b>まだタスクがないよ 🌱</b>＋ボタンから追加してみよう';area.append(empty);return}visible.forEach(t=>{const card=document.createElement('article');card.className='task '+t.category+(t.done?' done':'');const head=document.createElement('div');head.className='taskhead';const check=document.createElement('button');check.className='check';check.type='button';check.textContent=t.done?'✓':'';check.setAttribute('aria-label',t.done?'未完了に戻す':'完了にする');check.onclick=()=>{t.done=!t.done;save();render()};const content=document.createElement('div');content.className='taskcontent';const title=document.createElement('div');title.className='taskname';title.textContent=t.name;const meta=document.createElement('div');meta.className='meta';[labels[t.category],t.due?'📅 '+t.due.replaceAll('-','/'):'',t.priority==='high'?'🔥 優先':t.priority==='low'?'ゆっくりでOK':''].filter(Boolean).forEach(s=>{const pill=document.createElement('span');pill.className='pill';pill.textContent=s;meta.append(pill)});content.append(title,meta);const edit=document.createElement('button');edit.className='edit';edit.type='button';edit.textContent='⋯';edit.setAttribute('aria-label','編集');edit.onclick=()=>open(t.id);head.append(check,content,edit);card.append(head);area.append(card)})}function open(id=null){editing=id;const t=tasks.find(x=>x.id===id);$('modalTitle').textContent=t?'タスクを編集 ✏️':'新しいタスク ✨';$('name').value=t?.name||'';$('category').value=t?.category||'life';$('due').value=t?.due||'';$('priority').value=t?.priority||'normal';$('delete').hidden=!t;$('overlay').classList.add('show');setTimeout(()=>$('name').focus(),100)}function close(){$('overlay').classList.remove('show');editing=null}$('add').onclick=()=>open();$('cancel').onclick=close;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});$('filters').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){filter=b.dataset.cat;render()}};$('form').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;const t=tasks.find(x=>x.id===editing);if(t){Object.assign(t,{name,category:$('category').value,due:$('due').value,priority:$('priority').value})}else tasks.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),name,category:$('category').value,due:$('due').value,priority:$('priority').value,done:false});save();close();render()};$('delete').onclick=()=>{if(editing&&confirm('このタスクを削除しますか？')){tasks=tasks.filter(x=>x.id!==editing);save();close();render()}};render()})();
</script></body></html>
